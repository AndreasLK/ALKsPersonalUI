services:
  alks-ui-showcase:
    image: ghcr.io/andreaslk/alks-ui-showcase:latest
    container_name: alks-ui-showcase
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    expose:
      - "80"
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
